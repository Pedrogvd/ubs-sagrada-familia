server {
    listen 80;
    server_name ubs-sagrada-familia.duckdns.org;

    # usado pelo Certbot pra renovar o certificado sem precisar parar o proxy
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # redireciona todo o resto do HTTP pra HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ubs-sagrada-familia.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/ubs-sagrada-familia.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubs-sagrada-familia.duckdns.org/privkey.pem;

    # Rotas da API vao pro backend
    location ~ ^/(auth|health-professionals|patients|visits|dashboard|reports|ivcf-assessments) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo mais vai pro frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
