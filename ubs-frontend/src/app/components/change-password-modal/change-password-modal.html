@if (isOpen) {
  <div class="modal-overlay" (click)="onClose()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <h2>Alterar senha</h2>

      @if (successMessage()) {
        <p class="success">{{ successMessage() }}</p>
        <button type="button" (click)="onClose()">Fechar</button>
      } @else {
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          @if (errorMessage()) {
            <p class="error">{{ errorMessage() }}</p>
          }

          <label>
            <span class="field-label">Senha atual <span class="required">*</span></span>
            <input type="password" formControlName="currentPassword" required />
            @if (getError('currentPassword'); as error) {
            <span class="field-error">{{ error }}</span>
            }
          </label>

          <label>
            <span class="field-label">Nova senha <span class="required">*</span></span>
            <input type="password" formControlName="newPassword" required />
            @if (getError('newPassword'); as error) {
            <span class="field-error">{{ error }}</span>
            }
          </label>

          <label>
            <span class="field-label">Confirmar nova senha <span class="required">*</span></span>
            <input type="password" formControlName="confirmPassword" required />
            @if (getError('confirmPassword'); as error) {
            <span class="field-error">{{ error }}</span>
            }
          </label>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
            <button type="submit" [disabled]="form.invalid">Salvar</button>
          </div>
        </form>
      }
    </div>
  </div>
}
