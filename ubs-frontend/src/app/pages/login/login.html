<div class="login-page">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="login-logos">
      <img src="CityHallLogo.png" alt="Prefeitura de Belo Horizonte" class="login-logo" />
      <span class="login-logo-divider"></span>
      <img src="SUS.png" alt="Sistema Único de Saúde" class="login-logo" />
    </div>
    <h1>Bem-vindo</h1>
    <p class="subtitle">Entre no sistema</p>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <label>
      Email
      <input type="email" formControlName="email" />
    </label>

    <label>
      Senha
      <input type="password" formControlName="password" />
    </label>

    <button type="submit" [disabled]="form.invalid">Entrar</button>
  </form>
</div>
