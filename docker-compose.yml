services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es01
    restart: unless-stopped
    environment:
      - node.name=es01
      - cluster.name=ubs-sagrada-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - es01data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - ubs-elastic

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es02
    restart: unless-stopped
    environment:
      - node.name=es02
      - cluster.name=ubs-sagrada-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - es02data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
    networks:
      - ubs-elastic

  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es03
    restart: unless-stopped
    environment:
      - node.name=es03
      - cluster.name=ubs-sagrada-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - es03data:/usr/share/elasticsearch/data
    ports:
      - "9202:9200"
    networks:
      - ubs-elastic

  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      - ES_URL=http://es01:9200
      - PORT=3000
    volumes:
      - backend_logs:/app/logs
    depends_on:
      - es01
      - es02
      - es03
    networks:
      - ubs-elastic

  frontend:
    build:
      context: ./ubs-frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - ubs-elastic

  proxy:
    image: nginx:alpine
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - ubs-elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - XPACK_SECURITY_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=384
    ports:
      # só acessivel de dentro do proprio servidor (via tunel SSH) -- nunca exposto pra internet
      - "127.0.0.1:5601:5601"
    depends_on:
      - es01
      - es02
      - es03
    networks:
      - ubs-elastic

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - backend_logs:/usr/share/logstash/backend-logs:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      - es01
      - es02
      - es03
      - backend
    networks:
      - ubs-elastic

volumes:
  es01data:
  es02data:
  es03data:
  backend_logs:
  logstash_data:

networks:
  ubs-elastic:
    driver: bridge
