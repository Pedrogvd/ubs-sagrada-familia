input {
  file {
    path => "/usr/share/logstash/backend-logs/access.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-access-log"
  }
}

filter {
  grok {
    match => { "message" => "%{COMMONAPACHELOG}" }
  }
  date {
    match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://es01:9200"]
    index => "ubs-access-logs-%{+YYYY.MM.dd}"
  }
}
